name: Bootstrap Khidthun APK Distribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-khidthun-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Khidthun APK
        run: |
          mkdir -p khidthun/releases
          curl --fail --location --retry 3 --output /tmp/khidthun.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7eb8-8211-a83b-32c384b64651/raw?se=2026-08-31T02%3A47%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=35cbec10-a24a-5eb1-9e58-adc214bb0d35&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T01%3A32%3A26Z&ske=2026-09-01T01%3A32%3A26Z&sks=b&skv=2026-02-06&sig=vQeByIsdhz4Mm9M22B6HjTfYnt4%2FzX%2BwJAnoHHPijtI%3D'
          unzip -j /tmp/khidthun.zip app-debug.apk -d /tmp
          echo '54484b22747548bb50feea5ce45a55d1ca775a2152ea78478cf29ff89cbc6fcd  /tmp/app-debug.apk' | sha256sum -c -
          cp /tmp/app-debug.apk khidthun/releases/khidthun-1.0.3-beta.apk
          cp /tmp/app-debug.apk khidthun/latest.apk

      - name: Publish update manifest
        run: |
          cat > khidthun/app-update.json <<'JSON'
          {
            "appId": "khidthun",
            "channel": "staging",
            "versionCode": 4,
            "versionName": "1.0.3-beta",
            "latestVersionCode": 4,
            "latestVersionName": "1.0.3-beta",
            "minSupportedVersionCode": 1,
            "minimumSupportedVersionCode": 1,
            "mandatory": false,
            "forceUpdate": false,
            "force": false,
            "downloadUrl": "https://raw.githubusercontent.com/gananajak-lgtm/gananajak-app-updates/main/khidthun/releases/khidthun-1.0.3-beta.apk",
            "releaseNotes": "อัปเดตโลโก้แอป และเปลี่ยนการออกจากแอปเป็นกด Back 2 ครั้ง",
            "message": "คิดทุน 1.0.3-beta พร้อมอัปเดต",
            "sha256": "54484b22747548bb50feea5ce45a55d1ca775a2152ea78478cf29ff89cbc6fcd"
          }
          JSON

      - name: Commit public update assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add khidthun/app-update.json khidthun/latest.apk khidthun/releases/khidthun-1.0.3-beta.apk
          git diff --cached --quiet && exit 0
          git commit -m 'release(khidthun): publish 1.0.3-beta APK'
          git push
