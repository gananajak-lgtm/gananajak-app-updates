name: Publish Khidthun 1.0.5-beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-khidthun-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Khidthun APK
        run: |
          set -euo pipefail
          mkdir -p khidthun/releases
          curl --fail --location --retry 3 --output /tmp/khidthun-v6.zip 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-cf1c-8208-94a5-b92956f547c2/raw?se=2026-08-31T03%3A15%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d81db89c-e55f-5099-a959-d3544d79eae7&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T02%3A30%3A40Z&ske=2026-09-01T02%3A30%3A40Z&sks=b&skv=2026-02-06&sig=uPsWvjZuQtHam8a5mhEHkqzc0c2%2BTMZx4%2FAjdukQ3KQ%3D'
          unzip -j /tmp/khidthun-v6.zip app-debug.apk -d /tmp
          echo '2b9f9b804da26be6c44feeb2c50ca0c47b61ea3656c6bacead86caa8b725649a  /tmp/app-debug.apk' | sha256sum -c -
          cp /tmp/app-debug.apk khidthun/releases/khidthun-1.0.5-beta.apk
          cp /tmp/app-debug.apk khidthun/latest.apk

      - name: Publish update manifest
        run: |
          cat > khidthun/app-update.json <<'JSON'
          {
            "appId": "khidthun",
            "channel": "staging",
            "versionCode": 6,
            "versionName": "1.0.5-beta",
            "latestVersionCode": 6,
            "latestVersionName": "1.0.5-beta",
            "minSupportedVersionCode": 1,
            "minimumSupportedVersionCode": 1,
            "mandatory": false,
            "forceUpdate": false,
            "force": false,
            "downloadUrl": "https://raw.githubusercontent.com/gananajak-lgtm/gananajak-app-updates/main/khidthun/releases/khidthun-1.0.5-beta.apk",
            "releaseNotes": "อัปเดตโลโก้คิดทุนเป็นโทนน้ำเงินแวววาว และคงระบบกด Back 2 ครั้งเพื่อออก",
            "message": "คิดทุน 1.0.5-beta พร้อมอัปเดตโลโก้ใหม่",
            "sha256": "2b9f9b804da26be6c44feeb2c50ca0c47b61ea3656c6bacead86caa8b725649a"
          }
          JSON

      - name: Commit public update assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add khidthun/app-update.json khidthun/latest.apk khidthun/releases/khidthun-1.0.5-beta.apk
          git diff --cached --quiet && exit 0
          git commit -m 'release(khidthun): publish 1.0.5-beta blue icon update'
          git push
