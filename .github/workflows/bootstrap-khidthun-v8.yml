name: Publish Khidthun 1.0.7-beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-khidthun-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Khidthun APK
        run: |
          set -euo pipefail
          mkdir -p khidthun/releases
          curl --fail --location --retry 3 --output /tmp/khidthun-v8.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b6fc-8211-8a66-f93f4d627c33/raw?se=2026-08-31T03%3A47%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=81153e94-8520-52a4-82a9-063606036516&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T02%3A30%3A39Z&ske=2026-09-01T02%3A30%3A39Z&sks=b&skv=2026-02-06&sig=QpdHJvTPmFlJmDbbugB/P4/vM/1D/Syjum93DXH6TkM%3D'
          unzip -j /tmp/khidthun-v8.zip app-debug.apk -d /tmp
          echo '71724e6f22343975ec147afd4086df0069e51f11ba2f806b3556d497d5f0b8a1  /tmp/app-debug.apk' | sha256sum -c -
          cp /tmp/app-debug.apk khidthun/releases/khidthun-1.0.7-beta.apk
          cp /tmp/app-debug.apk khidthun/latest.apk

      - name: Publish update manifest
        run: |
          cat > khidthun/app-update.json <<'JSON'
          {
            "appId": "khidthun",
            "channel": "staging",
            "versionCode": 8,
            "versionName": "1.0.7-beta",
            "latestVersionCode": 8,
            "latestVersionName": "1.0.7-beta",
            "minSupportedVersionCode": 1,
            "minimumSupportedVersionCode": 1,
            "mandatory": false,
            "forceUpdate": false,
            "force": false,
            "downloadUrl": "https://raw.githubusercontent.com/gananajak-lgtm/gananajak-app-updates/main/khidthun/releases/khidthun-1.0.7-beta.apk",
            "releaseNotes": "อัปเดตโลโก้คิดทุนเป็นสีน้ำเงินแวววาวแบบใหม่ และคงระบบ Stable Signing สำหรับการอัปเดตทับ",
            "message": "คิดทุน 1.0.7-beta พร้อมอัปเดตโลโก้ใหม่",
            "sha256": "71724e6f22343975ec147afd4086df0069e51f11ba2f806b3556d497d5f0b8a1"
          }
          JSON

      - name: Commit public update assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add khidthun/app-update.json khidthun/latest.apk khidthun/releases/khidthun-1.0.7-beta.apk
          git diff --cached --quiet && exit 0
          git commit -m 'release(khidthun): publish 1.0.7-beta glossy blue icon'
          git push
