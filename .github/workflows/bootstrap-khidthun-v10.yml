name: Publish Khidthun 1.0.9-beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-khidthun-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Khidthun APK
        run: |
          set -euo pipefail
          mkdir -p khidthun/releases
          curl --fail --location --retry 3 --output /tmp/khidthun-v10.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-c4b0-8211-bffa-3d9ce9429d65/raw?se=2026-08-31T04%3A06%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=cb535070-f6d0-52b8-b38a-7e036ea66a07&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T01%3A31%3A49Z&ske=2026-09-01T01%3A31%3A49Z&sks=b&skv=2026-02-06&sig=LUP78kZsjNmL6WhVnlaOeI6UwcIpEJRyABq0TftNZxc%3D'
          unzip -j /tmp/khidthun-v10.zip app-debug.apk -d /tmp
          echo 'a79ab9eddb8a66f8ce84e630a79506a79598a1204a581b0b70f6730f18574e68  /tmp/app-debug.apk' | sha256sum -c -
          cp /tmp/app-debug.apk khidthun/releases/khidthun-1.0.9-beta.apk
          cp /tmp/app-debug.apk khidthun/latest.apk

      - name: Publish update manifest
        run: |
          cat > khidthun/app-update.json <<'JSON'
          {
            "appId": "khidthun",
            "channel": "staging",
            "versionCode": 10,
            "versionName": "1.0.9-beta",
            "latestVersionCode": 10,
            "latestVersionName": "1.0.9-beta",
            "minSupportedVersionCode": 9,
            "minimumSupportedVersionCode": 9,
            "mandatory": false,
            "forceUpdate": false,
            "force": false,
            "downloadUrl": "https://raw.githubusercontent.com/gananajak-lgtm/gananajak-app-updates/main/khidthun/releases/khidthun-1.0.9-beta.apk",
            "releaseNotes": "ทดสอบอัปเดตทับจาก Clean Staging Baseline 1.0.8-beta โดยใช้ package และ Stable Signing เดิม",
            "message": "คิดทุน 1.0.9-beta พร้อมอัปเดตทดสอบการติดตั้งทับ",
            "sha256": "a79ab9eddb8a66f8ce84e630a79506a79598a1204a581b0b70f6730f18574e68"
          }
          JSON

      - name: Commit public update assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add khidthun/app-update.json khidthun/latest.apk khidthun/releases/khidthun-1.0.9-beta.apk
          git diff --cached --quiet && exit 0
          git commit -m 'release(khidthun): publish 1.0.9-beta staging update test'
          git push
